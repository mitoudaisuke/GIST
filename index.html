<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Gist Viewer</title>
  <link rel="apple-touch-icon" href="./icon.png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #181716;
      --panel: #20201e;
      --panel-strong: #272724;
      --panel-soft: #171715;
      --line: #3b3a36;
      --line-soft: #2d2c29;
      --text: #f3f1ea;
      --muted: #aaa59b;
      --muted-strong: #d8d1c5;
      --accent: #48c6a8;
      --accent-strong: #7be0c8;
      --warn: #e3bd5f;
      --shadow: rgba(0, 0, 0, 0.38);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--sans);
      padding: 0;
    }

    button,
    input {
      font: inherit;
    }

    .viewer-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel-soft);
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .viewer-heading {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 34%);
      border-radius: 8px;
      background: #18382f;
      color: var(--accent-strong);
      font: 800 14px/1 var(--sans);
    }

    .viewer-title {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-subtitle {
      margin: 3px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-actions,
    .viewer-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-actions {
      flex: 0 0 auto;
    }

    .viewer-status {
      min-width: 112px;
      padding: 6px 9px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: #1b1b19;
      color: var(--muted-strong);
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .viewer-button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
    }

    .viewer-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      font-size: 13px;
    }

    .viewer-button:hover {
      border-color: color-mix(in srgb, var(--accent), var(--line) 45%);
      background: #30302d;
    }

    .viewer-button:active {
      transform: translateY(1px);
    }

    .viewer-button:disabled {
      cursor: wait;
      opacity: 0.66;
    }

    .button-icon {
      color: var(--accent-strong);
      font-size: 15px;
      line-height: 1;
    }

    .info-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft);
      background: #171715;
    }

    .info-card {
      min-width: 210px;
      display: inline-flex;
      flex: 1 1 210px;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border: 1px solid var(--line-soft);
      border-radius: 7px;
      background: #20201e;
    }

    .info-icon {
      width: 28px;
      height: 28px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 7px;
      background: #18382f;
      color: var(--accent-strong);
      font-size: 15px;
    }

    .info-label {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
    }

    .info-value {
      margin: 0;
      color: var(--text);
      font: 13px/1.25 var(--mono);
      white-space: nowrap;
    }

    .log-viewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #10100f;
      -webkit-overflow-scrolling: touch;
    }

    .log-content {
      min-width: max-content;
      padding: 10px 0 18px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.55;
      tab-size: 2;
    }

    .log-line {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      min-height: 24px;
      border-left: 3px solid transparent;
    }

    .log-line:hover {
      background: #191917;
      border-left-color: var(--accent);
    }

    .line-number {
      position: sticky;
      left: 0;
      z-index: 1;
      padding: 2px 10px 2px 12px;
      border-right: 1px solid var(--line-soft);
      background: #10100f;
      color: #777269;
      text-align: right;
      user-select: none;
    }

    .line-text {
      padding: 2px 18px 2px 14px;
      color: #ece8de;
      white-space: pre;
    }

    .log-viewport.is-wrapped .log-content {
      min-width: 0;
    }

    .log-viewport.is-wrapped .line-text {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .empty-state {
      padding: 28px 18px;
      color: var(--muted);
      font: 13px/1.5 var(--sans);
    }

    @media (min-width: 768px) {
      html, body {
        background: #1b1a18;
      }

      body {
        padding: 24px;
      }

      .viewer-shell {
        width: min(1180px, 100%);
        height: calc(100vh - 48px);
        height: calc(100dvh - 48px);
        min-height: 480px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 22px 58px var(--shadow);
      }

      .viewer-header {
        padding: 14px 16px 14px 18px;
      }

      .log-content {
        font-size: 13.5px;
      }
    }

    @media (max-width: 700px) {
      .viewer-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .viewer-actions,
      .info-strip {
        width: 100%;
      }

      .viewer-status {
        flex: 1;
        min-width: 0;
      }

      .info-card {
        width: 100%;
        min-width: 0;
      }

      .button-text {
        display: none;
      }

      .viewer-button {
        width: 38px;
        justify-content: center;
        padding: 0;
      }

      .log-line {
        grid-template-columns: 46px minmax(0, 1fr);
      }

      .line-number {
        padding-left: 8px;
        padding-right: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-header">
      <div class="viewer-heading">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div>
          <h1 class="viewer-title">My Gist Viewer</h1>
          <p class="viewer-subtitle" id="summary">simple.log</p>
        </div>
      </div>
      <div class="viewer-actions">
        <span class="viewer-status" id="status">読み込み中...</span>
        <button class="viewer-button" id="refreshButton" type="button" title="更新" aria-label="更新">
          <span class="button-icon" aria-hidden="true">↻</span>
          <span class="button-text">更新</span>
        </button>
        <button class="viewer-button" id="copyButton" type="button" title="コピー" aria-label="コピー">
          <span class="button-icon" aria-hidden="true">⧉</span>
          <span class="button-text">コピー</span>
        </button>
      </div>
    </header>
    <section class="info-strip" aria-label="システム情報">
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">↻</span>
        <div>
          <p class="info-label">最終Mac再起動</p>
          <p class="info-value" id="rebootInfo">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">S</span>
        <div>
          <p class="info-label">最終Supervisor再起動</p>
          <p class="info-value" id="supervisorInfo">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">R</span>
        <div>
          <p class="info-label">最終Runner再起動</p>
          <p class="info-value" id="runnerInfo">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">5</span>
        <div>
          <p class="info-label">最終5分足更新</p>
          <p class="info-value" id="m5Info">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">FX</span>
        <div>
          <p class="info-label">最終FX終値更新</p>
          <p class="info-value" id="fxCloseInfo">未検出</p>
        </div>
      </div>
    </section>
    <div class="log-viewport is-wrapped" id="logViewport" tabindex="0">
      <div class="log-content" id="content" role="log" aria-label="Gist log">
        <div class="empty-state">Loading...</div>
      </div>
    </div>
  </main>

  <script>
    const GIST_RAW_URL = "https://gist.githubusercontent.com/mitoudaisuke/ea5ebde96fbaebe416bde113c7aed631/raw/simple.log";
    const contentEl = document.getElementById("content");
    const logViewport = document.getElementById("logViewport");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const refreshButton = document.getElementById("refreshButton");
    const copyButton = document.getElementById("copyButton");
    const rebootInfo = document.getElementById("rebootInfo");
    const supervisorInfo = document.getElementById("supervisorInfo");
    const runnerInfo = document.getElementById("runnerInfo");
    const m5Info = document.getElementById("m5Info");
    const fxCloseInfo = document.getElementById("fxCloseInfo");

    let lastLoadedAt = 0;
    let currentText = "";
    const MIN_INTERVAL_MS = 3000;
    const STOCKS_META_PREFIX = "# stocks-meta ";

    function scrollToBottom() {
      requestAnimationFrame(() => {
        logViewport.scrollTop = logViewport.scrollHeight;
        window.scrollTo(0, document.documentElement.scrollHeight);
      });
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function splitLines(text) {
      if (!text) {
        return [];
      }

      return text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    }

    function parseStocksMetadata(lines) {
      const metadata = {};
      lines.forEach((line) => {
        if (!line.startsWith(STOCKS_META_PREFIX)) {
          return;
        }

        const body = line.slice(STOCKS_META_PREFIX.length);
        const pairPattern = /([a-zA-Z0-9_]+)=([^\s]+)/g;
        let pair = pairPattern.exec(body);
        while (pair) {
          metadata[pair[1]] = pair[2];
          pair = pairPattern.exec(body);
        }
      });
      return metadata;
    }

    function formatDateTimeValue(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function findLastRebootTime(lines) {
      for (let i = lines.length - 1; i >= 0; i -= 1) {
        const line = lines[i];
        if (!/reboot|再起動/i.test(line)) {
          continue;
        }

        const match = line.match(/\b([01]?\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?\b/);
        if (match) {
          return {
            hour: match[1].padStart(2, "0"),
            minute: match[2],
            second: match[3] || "00"
          };
        }
      }

      return null;
    }

    function formatMetadataDate(metadata, key) {
      if (!metadata[key]) {
        return "未検出";
      }

      return formatDateTimeValue(metadata[key]);
    }

    function formatRebootInfo(lines, metadata) {
      if (metadata.mac_last_boot_at) {
        return formatDateTimeValue(metadata.mac_last_boot_at);
      }

      const rebootTime = findLastRebootTime(lines);
      if (!rebootTime) {
        return "未検出";
      }

      const now = new Date();
      const rebootDate = new Date(now);
      rebootDate.setHours(Number(rebootTime.hour), Number(rebootTime.minute), Number(rebootTime.second), 0);

      if (rebootDate.getTime() - now.getTime() > 5 * 60 * 1000) {
        rebootDate.setDate(rebootDate.getDate() - 1);
      }

      const dateText = rebootDate.toLocaleDateString("ja-JP", {
        month: "2-digit",
        day: "2-digit"
      });
      return dateText + " " + rebootTime.hour + ":" + rebootTime.minute + ":" + rebootTime.second;
    }

    function renderLog(text) {
      currentText = text;
      const lines = splitLines(text);
      const metadata = parseStocksMetadata(lines);
      const fragment = document.createDocumentFragment();

      contentEl.textContent = "";

      lines.forEach((line, index) => {
        const lineEl = document.createElement("div");
        lineEl.className = "log-line";

        const numberEl = document.createElement("span");
        numberEl.className = "line-number";
        numberEl.textContent = index + 1;

        const textEl = document.createElement("code");
        textEl.className = "line-text";
        textEl.textContent = line;

        lineEl.append(numberEl, textEl);
        fragment.append(lineEl);
      });

      if (!lines.length) {
        const emptyEl = document.createElement("div");
        emptyEl.className = "empty-state";
        emptyEl.textContent = "ログが空です";
        fragment.append(emptyEl);
      }

      contentEl.append(fragment);
      summaryEl.textContent = "simple.log · " + lines.length + "行";
      rebootInfo.textContent = formatRebootInfo(lines, metadata);
      supervisorInfo.textContent = formatMetadataDate(metadata, "last_supervisor_restart_at");
      runnerInfo.textContent = formatMetadataDate(metadata, "last_runner_restart_at");
      m5Info.textContent = formatMetadataDate(metadata, "last_m5_update_at");
      fxCloseInfo.textContent = formatMetadataDate(metadata, "last_fx_close_update_at");
    }

    async function loadGist(force = false) {
      const now = Date.now();
      if (!force && now - lastLoadedAt < MIN_INTERVAL_MS) {
        return;
      }

      refreshButton.disabled = true;
      setStatus("読み込み中...");

      try {
        const url = GIST_RAW_URL + "?t=" + now;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const text = await res.text();
        renderLog(text);
        lastLoadedAt = now;
        setStatus("更新 " + new Date(now).toLocaleTimeString("ja-JP", { hour12: false }));
        scrollToBottom();
      } catch (e) {
        console.error(e);
        setStatus("更新失敗");
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", () => {
      loadGist(true);
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(currentText);
        setStatus("コピーしました");
      } catch (e) {
        console.error(e);
        setStatus("コピー失敗");
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadGist(true);
      }
    });

    window.addEventListener("pageshow", () => {
      loadGist(true);
    });

    window.addEventListener("load", () => {
      loadGist(true);
    });
  </script>
</body>
</html>
