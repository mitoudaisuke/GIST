<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Gist Viewer</title>
  <link rel="apple-touch-icon" href="./icon.png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #181716;
      --panel: #20201e;
      --panel-strong: #272724;
      --panel-soft: #171715;
      --line: #3b3a36;
      --line-soft: #2d2c29;
      --text: #f3f1ea;
      --muted: #aaa59b;
      --muted-strong: #d8d1c5;
      --accent: #48c6a8;
      --accent-strong: #7be0c8;
      --warn: #e3bd5f;
      --shadow: rgba(0, 0, 0, 0.38);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--sans);
      padding: 0;
    }

    button,
    input {
      font: inherit;
    }

    .viewer-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel-soft);
    }

    .info-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft);
      background: #171715;
    }

    .info-card {
      min-width: 210px;
      display: inline-flex;
      flex: 1 1 210px;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border: 1px solid var(--line-soft);
      border-radius: 7px;
      background: #20201e;
    }

    .info-icon {
      width: 28px;
      height: 28px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 7px;
      background: #18382f;
      color: var(--accent-strong);
      font-size: 15px;
    }

    .info-label {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
    }

    .info-value {
      margin: 0;
      color: var(--text);
      font: 13px/1.25 var(--mono);
      white-space: nowrap;
    }

    .log-viewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #10100f;
      -webkit-overflow-scrolling: touch;
    }

    .log-content {
      min-width: max-content;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      padding: 10px 0 18px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.55;
      tab-size: 2;
    }

    .log-line {
      grid-column: 1 / -1;
      min-height: 24px;
      border-left: 3px solid transparent;
    }

    .log-line:hover {
      background: #191917;
      border-left-color: var(--accent);
    }

    .line-text {
      padding: 2px 18px 2px 14px;
      color: #ece8de;
      white-space: pre;
    }

    .log-card {
      grid-column: 1 / -1;
      width: auto;
      min-width: 0;
      margin: 8px 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #181817;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .log-card-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .log-card-row .log-card {
      margin-left: 14px;
      margin-right: 14px;
    }

    .log-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: #23231f;
      white-space: nowrap;
    }

    .log-card-title {
      color: var(--accent-strong);
      font: 700 12px/1.25 var(--sans);
    }

    .log-card-time {
      color: var(--muted);
      font: 12px/1.25 var(--mono);
    }

    .log-card-body {
      padding: 7px 0;
    }

    .log-card-line {
      padding: 2px 12px;
      color: #ece8de;
      white-space: pre;
    }

    .log-viewport.is-wrapped .log-content {
      min-width: 0;
    }

    .log-viewport.is-wrapped .line-text {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .log-viewport.is-wrapped .log-card {
      width: auto;
    }

    .log-viewport.is-wrapped .log-card-line {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .empty-state {
      padding: 28px 18px;
      color: var(--muted);
      font: 13px/1.5 var(--sans);
    }

    @media (min-width: 768px) {
      html, body {
        background: #1b1a18;
      }

      body {
        padding: 24px;
      }

      .viewer-shell {
        width: min(1180px, 100%);
        height: calc(100vh - 48px);
        height: calc(100dvh - 48px);
        min-height: 480px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 22px 58px var(--shadow);
      }

      .log-content {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 10px;
        font-size: 13.5px;
      }

      .log-card-row {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 10px;
        padding: 0 14px;
      }

      .log-card-row .log-card {
        margin-left: 0;
        margin-right: 0;
      }

      .log-card-row .log-card.is-fx {
        grid-column: 1;
      }

      .log-card-row .log-card.is-equity {
        grid-column: 2;
        margin-top: calc(8px + 1.55em);
      }
    }

    @media (max-width: 700px) {
      .info-strip {
        width: 100%;
      }

      .info-card {
        width: 100%;
        min-width: 0;
      }

    }
  </style>
</head>
<body>
  <main class="viewer-shell">
    <section class="info-strip" aria-label="システム情報">
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">↻</span>
        <div>
          <p class="info-label">最終Mac再起動</p>
          <p class="info-value" id="rebootInfo">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">S</span>
        <div>
          <p class="info-label">最終Supervisor再起動</p>
          <p class="info-value" id="supervisorInfo">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">R</span>
        <div>
          <p class="info-label">最終Runner再起動</p>
          <p class="info-value" id="runnerInfo">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">5</span>
        <div>
          <p class="info-label">最終5分足更新</p>
          <p class="info-value" id="m5Info">未検出</p>
        </div>
      </div>
      <div class="info-card">
        <span class="info-icon" aria-hidden="true">FX</span>
        <div>
          <p class="info-label">最終FX終値更新</p>
          <p class="info-value" id="fxCloseInfo">未検出</p>
        </div>
      </div>
    </section>
    <div class="log-viewport is-wrapped" id="logViewport" tabindex="0">
      <div class="log-content" id="content" role="log" aria-label="Gist log">
        <div class="empty-state">Loading...</div>
      </div>
    </div>
  </main>

  <script>
    const GIST_RAW_URL = "https://gist.githubusercontent.com/mitoudaisuke/ea5ebde96fbaebe416bde113c7aed631/raw/simple.log";
    const contentEl = document.getElementById("content");
    const logViewport = document.getElementById("logViewport");
    const rebootInfo = document.getElementById("rebootInfo");
    const supervisorInfo = document.getElementById("supervisorInfo");
    const runnerInfo = document.getElementById("runnerInfo");
    const m5Info = document.getElementById("m5Info");
    const fxCloseInfo = document.getElementById("fxCloseInfo");

    let lastLoadedAt = 0;
    const MIN_INTERVAL_MS = 3000;
    const STOCKS_META_PREFIX = "# stocks-meta ";

    function scrollToBottom() {
      requestAnimationFrame(() => {
        logViewport.scrollTop = logViewport.scrollHeight;
        window.scrollTo(0, document.documentElement.scrollHeight);
      });
    }

    function splitLines(text) {
      if (!text) {
        return [];
      }

      return text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    }

    function parseStocksMetadata(lines) {
      const metadata = {};
      lines.forEach((line) => {
        if (!line.startsWith(STOCKS_META_PREFIX)) {
          return;
        }

        const body = line.slice(STOCKS_META_PREFIX.length);
        const pairPattern = /([a-zA-Z0-9_]+)=([^\s]+)/g;
        let pair = pairPattern.exec(body);
        while (pair) {
          metadata[pair[1]] = pair[2];
          pair = pairPattern.exec(body);
        }
      });
      return metadata;
    }

    function formatDateTimeValue(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function findLastRebootTime(lines) {
      for (let i = lines.length - 1; i >= 0; i -= 1) {
        const line = lines[i];
        if (!/reboot|再起動/i.test(line)) {
          continue;
        }

        const match = line.match(/\b([01]?\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?\b/);
        if (match) {
          return {
            hour: match[1].padStart(2, "0"),
            minute: match[2],
            second: match[3] || "00"
          };
        }
      }

      return null;
    }

    function formatMetadataDate(metadata, key) {
      if (!metadata[key]) {
        return "未検出";
      }

      return formatDateTimeValue(metadata[key]);
    }

    function formatRebootInfo(lines, metadata) {
      if (metadata.mac_last_boot_at) {
        return formatDateTimeValue(metadata.mac_last_boot_at);
      }

      const rebootTime = findLastRebootTime(lines);
      if (!rebootTime) {
        return "未検出";
      }

      const now = new Date();
      const rebootDate = new Date(now);
      rebootDate.setHours(Number(rebootTime.hour), Number(rebootTime.minute), Number(rebootTime.second), 0);

      if (rebootDate.getTime() - now.getTime() > 5 * 60 * 1000) {
        rebootDate.setDate(rebootDate.getDate() - 1);
      }

      const dateText = rebootDate.toLocaleDateString("ja-JP", {
        month: "2-digit",
        day: "2-digit"
      });
      return dateText + " " + rebootTime.hour + ":" + rebootTime.minute + ":" + rebootTime.second;
    }

    function isBoxStart(line) {
      return /^┌.*┐$/.test(line);
    }

    function isBoxEnd(line) {
      return /^└.*┘$/.test(line);
    }

    function isTimeOnlyLine(line) {
      return /^\d{2}:\d{2}:\d{2}$/.test(String(line).trim());
    }

    function formatBoxTitle(line) {
      const text = line.replace(/[┌┐─]/g, "").trim();
      return text || "LOG";
    }

    function formatBoxLine(line) {
      return line
        .replace(/^\|\s?/, "")
        .replace(/\s?\|$/, "")
        .trimEnd();
    }

    function appendPlainLine(fragment, line) {
      const lineEl = document.createElement("div");
      lineEl.className = "log-line";

      const textEl = document.createElement("code");
      textEl.className = "line-text";
      textEl.textContent = line;

      lineEl.append(textEl);
      fragment.append(lineEl);
    }

    function cardKindForTitle(title) {
      const normalized = String(title || "").toUpperCase();
      if (normalized.includes("FX")) {
        return "fx";
      }
      if (normalized.includes("TYSE") || normalized.includes("NYSE")) {
        return "equity";
      }
      return "other";
    }

    function cardClassForTitle(title) {
      const kind = cardKindForTitle(title);
      if (kind === "fx") {
        return "is-fx";
      }
      if (kind === "equity") {
        return "is-equity";
      }
      return "is-other";
    }

    function createLogCard(title, bodyLines, timeText = "") {
      const cardEl = document.createElement("section");
      cardEl.className = "log-card " + cardClassForTitle(title);

      const headerEl = document.createElement("div");
      headerEl.className = "log-card-header";

      if (timeText) {
        const timeEl = document.createElement("time");
        timeEl.className = "log-card-time";
        timeEl.textContent = timeText;
        headerEl.append(timeEl);
      }

      const titleEl = document.createElement("div");
      titleEl.className = "log-card-title";
      titleEl.textContent = title;
      headerEl.append(titleEl);

      const bodyEl = document.createElement("div");
      bodyEl.className = "log-card-body";

      bodyLines.forEach((bodyLine) => {
        const lineEl = document.createElement("div");
        lineEl.className = "log-card-line";
        lineEl.textContent = bodyLine;
        bodyEl.append(lineEl);
      });

      cardEl.append(headerEl, bodyEl);
      return cardEl;
    }

    function appendLogCard(fragment, title, bodyLines, timeText = "") {
      fragment.append(createLogCard(title, bodyLines, timeText));
    }

    function appendLogCardPair(fragment, leftCard, rightCard) {
      const rowEl = document.createElement("div");
      rowEl.className = "log-card-row";
      rowEl.append(createLogCard(leftCard.title, leftCard.bodyLines, leftCard.timeText));
      rowEl.append(createLogCard(rightCard.title, rightCard.bodyLines, rightCard.timeText));
      fragment.append(rowEl);
    }

    function timeToSeconds(timeText) {
      const match = String(timeText || "").match(/^(\d{2}):(\d{2}):(\d{2})$/);
      if (!match) {
        return null;
      }
      return Number(match[1]) * 3600 + Number(match[2]) * 60 + Number(match[3]);
    }

    function areNearbyCards(firstCard, secondCard) {
      const firstSeconds = timeToSeconds(firstCard.timeText);
      const secondSeconds = timeToSeconds(secondCard.timeText);
      if (firstSeconds === null || secondSeconds === null) {
        return true;
      }
      const diff = Math.abs(secondSeconds - firstSeconds);
      return Math.min(diff, 86400 - diff) <= 10 * 60;
    }

    function arePairableCards(firstCard, secondCard) {
      if (!firstCard || !secondCard) {
        return false;
      }
      const kinds = [firstCard.kind, secondCard.kind].sort().join(":");
      return kinds === "equity:fx" && areNearbyCards(firstCard, secondCard);
    }

    function appendCardItem(fragment, card) {
      appendLogCard(fragment, card.title, card.bodyLines, card.timeText);
    }

    function parseLogItems(lines) {
      const items = [];
      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        if (isTimeOnlyLine(line) && isBoxStart(lines[index + 1] || "")) {
          continue;
        }

        if (!isBoxStart(line)) {
          items.push({ type: "line", line });
          continue;
        }

        const title = formatBoxTitle(line);
        const timeText = index > 0 && isTimeOnlyLine(lines[index - 1]) ? lines[index - 1].trim() : "";
        const bodyLines = [];
        let cursor = index + 1;
        while (cursor < lines.length && !isBoxEnd(lines[cursor])) {
          bodyLines.push(formatBoxLine(lines[cursor]));
          cursor += 1;
        }

        if (cursor < lines.length && isBoxEnd(lines[cursor])) {
          items.push({
            type: "card",
            title,
            bodyLines,
            timeText,
            kind: cardKindForTitle(title)
          });
          index = cursor;
        } else {
          items.push({ type: "line", line });
        }
      }
      return items;
    }

    function renderLog(text) {
      const lines = splitLines(text);
      const metadata = parseStocksMetadata(lines);
      const fragment = document.createDocumentFragment();

      contentEl.textContent = "";

      const items = parseLogItems(lines);
      for (let index = 0; index < items.length; index += 1) {
        const item = items[index];
        if (item.type === "line") {
          appendPlainLine(fragment, item.line);
          continue;
        }

        const nextItem = items[index + 1];
        if (nextItem && nextItem.type === "card" && arePairableCards(item, nextItem)) {
          const leftCard = item.kind === "fx" ? item : nextItem;
          const rightCard = item.kind === "equity" ? item : nextItem;
          appendLogCardPair(fragment, leftCard, rightCard);
          index += 1;
          continue;
        }

        appendCardItem(fragment, item);
      }

      if (!lines.length) {
        const emptyEl = document.createElement("div");
        emptyEl.className = "empty-state";
        emptyEl.textContent = "ログが空です";
        fragment.append(emptyEl);
      }

      contentEl.append(fragment);
      rebootInfo.textContent = formatRebootInfo(lines, metadata);
      supervisorInfo.textContent = formatMetadataDate(metadata, "last_supervisor_restart_at");
      runnerInfo.textContent = formatMetadataDate(metadata, "last_runner_restart_at");
      m5Info.textContent = formatMetadataDate(metadata, "last_m5_update_at");
      fxCloseInfo.textContent = formatMetadataDate(metadata, "last_fx_close_update_at");
    }

    async function loadGist(force = false) {
      const now = Date.now();
      if (!force && now - lastLoadedAt < MIN_INTERVAL_MS) {
        return;
      }

      try {
        const url = GIST_RAW_URL + "?t=" + now;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const text = await res.text();
        renderLog(text);
        lastLoadedAt = now;
        scrollToBottom();
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadGist(true);
      }
    });

    window.addEventListener("pageshow", () => {
      loadGist(true);
    });

    window.addEventListener("load", () => {
      loadGist(true);
    });
  </script>
</body>
</html>
